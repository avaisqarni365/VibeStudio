# /etc/nginx/sites-available/vibestudio.conf
#
# Reverse proxy for VibeStudio.
# After symlinking into sites-enabled + reloading nginx, run:
#   sudo certbot --nginx -d vibestudio.codes-ai.uk
# to obtain TLS + auto-renewal.

# ── HTTP → HTTPS redirect (after certbot installs the cert) ─────────
server {
    listen 80;
    listen [::]:80;
    server_name vibestudio.codes-ai.uk;
    return 301 https://$host$request_uri;
}

# ── HTTPS — main site ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vibestudio.codes-ai.uk;

    # certbot fills these in
    # ssl_certificate     /etc/letsencrypt/live/vibestudio.codes-ai.uk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vibestudio.codes-ai.uk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── API — Express on :4100 ─────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_read_timeout 60s;
    }

    # ── Health (no auth) ───────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:4100;
    }

    # ── Web — Next.js on :3100 ─────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # ── Next.js static assets ──────────────────────────────────────
    location /_next/static {
        proxy_pass http://127.0.0.1:3100;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
